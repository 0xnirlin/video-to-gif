[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2gif"
version = "1.0.0"
description = "Turn a video into a high quality GIF with ffmpeg, with an optional target file size."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Ziztu" }]
keywords = ["gif", "video", "ffmpeg", "video-to-gif", "converter"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/0xnirlin/video-to-gif"

[project.scripts]
vid2gif = "vid2gif:main"

[tool.setuptools]
py-modules = ["vid2gif"]
